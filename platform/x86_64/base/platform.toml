[platform]

[build]
scopes = [
  "arch",
  "layout",
  "boot",
  "kernel",
  "mitigate",
  "unwind",
  "linkage",
  "debug"
]

[scope.layout]
# TODO: Introduce Compile-Time KASLR + make "normal" KASLR be called Load-Time KASLR.

# The (default) base load virtual address.
#
# This value is standard for upper-half `x86-64` kernels, it is the last `2 GiB` of the
# virtual address space.
base = 0xFFFFFFFF80000000

# The base physical address.
#
# This is the physical address the kernel is loaded at by-default.
physical_base = 0x1000000

# For this architecture, we use a "small" code model paired with a position-independent executable.
code-model = "small"
relocation-model = "pie"

# The linkage section.
#

[scope.linkage]
section_name = ".nekor.linkage"

# The symbol table for the dynamic segment. (`.dynsym`)
[scope.linkage.table]
section_name = ".nekor.linkage.table"

# The string table for the dynamic segment. (`.dynstr`)
[scope.linkage.table.string]
section_name = ".nekor.linkage.string"

[scope.linkage.table.section]
section_name = ".nekor.linkage.section"

# Dynamic linker hashtables for symbol resolution, both SysV and GNU versions.
[scope.linkage.hash]
section_name = ".nekor.linkage.hash"

[scope.linkage.hash.gnu]
section_name = ".nekor.linkage.hash.gnu"

[scope.linkage.symbol]
start = "__nekor_linkage_start"
end = "__nekor_linkage_end"

# The relocation section.
#
# In this case we observe two cases: relocations with either implicit or explicit addends.
#
# The relocation type can be determined via section flags. We use the section named defined+
# here as our prefix and append either ".implicit" or ".explicit" to the section name to
# properly define our relocation tables.
[scope.linkage.relocate]
section_name = ".nekor.relocate"

[scope.linkage.relocate.symbol]
# NOTE: There are no need for symbols in this case.

[scope.debug]
# Not an usermode target.
usermode = false

# Whether build should be verbose.
verbose = true

# The explicit whitelist of permitted debuginfo program sections.
info = [
  ".debug_abbrev",
  ".debug_aranges",
  ".debug_frame",
  ".debug_info",
  ".debug_line",
  ".debug_loc",
  ".debug_ranges",
  ".debug_str"
]

# The kernel symbol table.
[scope.debug.symbol]
section_name = ".nekor.debug.symbol"

# The strings for the kernel symbol table.
[scope.debug.symbol.string]
section_name = ".nekor.debug.symbol.string"

# The bootloader section.
#
# This is to contain the bootloader request and response block.
#
# This is reclaimed after boot.
[scope.boot]
section_name = ".nekor.boot"
symbol = "(Nekor Boot Record)"

# Bootloader feature requirements.
[scope.boot.feature]
section_name = ".nekor.boot.feature"
# The symbol pointing to the feature list string.
symbol = "(Nekor Boot Features)"
# The feature list to request from the bootloader.
#
# This is placed in the `PT_INTERP` program segment.
#
# On `usermode` builds, this is not set and the regular userspace dynamic
# program interpreter is used instead of a bootloader.
list = ["nekor-boot-v0"]

[scope.boot.request]
section_name = ".nekor.boot.request"
symbol = "(Nekor Boot Request)"

# Mitigation options.
[scope.mitigate]

[scope.unwind]
# Always use frame pointers for unwinding.
frame-pointer = true
# Do not use nor include unwind tables in the final binary.
unwind-table = false

[scope.kernel]

# Processor-local template section.
#
# This is located in the `PT_TLS` program segment, this is used for processor-local variables.
[scope.kernel.local]
section_name = ".nekor.local"

[scope.kernel.local.symbol]
start = "__nekor_local_start"
end = "__nekor_local_end"

# Kernel code section
[scope.kernel.code]
section_name = ".nekor.code"

[scope.kernel.code.symbol]
start = "__nekor_code_start"
end = "__nekor_code_end"

# Kernel data section
[scope.kernel.data]
section_name = ".nekor.data"

[scope.kernel.data.symbol]
start = "__nekor_data_start"
end = "__nekor_data_end"

[scope.kernel.data.zeroed]
section_name = ".nekor.data.zeroed"

[scope.kernel.data.zeroed.symbol]
start = "__nekor_data_zeroed_start"
end = "__nekor_data_zeroed_end"

[scope.kernel.data.readonly]
section_name = ".nekor.data.readonly"

[scope.kernel.data.readonly.symbol]
start = "__nekor_data_readonly_start"
end = "__nekor_data_readonly_end"

# Hot sections and D- and I-cache compaction
#
# These are placed in the same area as the regular code or area sections, but they are made
# the first in the list.
[scope.kernel.hot]

# Hot code section.
[scope.kernel.hot.code]
section_name = ".nekor.hot.code"

[scope.kernel.hot.code.symbol]
start = "__nekor_hot_code_start"
end = "__nekor_hot_code_end"

# Hot data section.
[scope.kernel.hot.data]
section_name = ".nekor.hot.data"

# Start/End boundaries for hot data.
[scope.kernel.hot.data.symbol]
start = "__nekor_hot_data_start"
end = "__nekor_hot_data_end"

# The system-level asynchronous scheduler
[scope.kernel.schedule]

# Contextual isolate storage used in the scheduler
[scope.kernel.schedule.isolate]
section_name = ".nekor.schedule.isolate"

[scope.kernel.schedule.isolate.symbol]
start = "__nekor_schedule_isolate_start"
end = "__nekor_schedule_isolate_end"

# Global run-queue list section
[scope.kernel.schedule.queue]
section_name = ".nekor.schedule.queue"

[scope.kernel.schedule.queue.symbol]
start = "__nekor_schedule_queue_start"
end = "__nekor_schedule_queue_end"

# Interrupt code section.
[scope.kernel.schedule.interrupt.code]
section_name = ".nekor.schedule.interrupt.code"

[scope.kernel.schedule.interrupt.code.symbol]
start = "__nekor_schedule_interrupt_code_start"
end = "__nekor_schedule_interrupt_code_end"

# Interrupt data section.
[scope.kernel.schedule.interrupt.data]
section_name = ".nekor.schedule.interrupt.data"

[scope.kernel.schedule.interrupt.data.symbol]
start = "__nekor_schedule_interrupt_data_start"
end = "__nekor_schedule_interrupt_data_end"

# Code section for the hotpatch system.
[scope.kernel.patch]
section_name = ".nekor.patch"
patchsite_symbol = "__nekor_patch"

[scope.kernel.patch.symbol]
start = "__nekor_patch_start"
end = "__nekor_patch_end"

# Data section for the Domain system.
#
# This is for internal kernel use, and is treated as regular read-write data.
[scope.kernel.domain]
section_name = ".nekor.domain"

[scope.arch]
[scope.arch.page]
[scope.arch.page.size]
normal = 4096  # 4 KiB
huge = 2097152  # 2 MiB
giga = 1073741824  # 1 GiB

[scope.arch.cache]
# The size of a cacheline that is pulled from `Ln` cache
size = 64
