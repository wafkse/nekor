name: Rust Lint

on:
    workflow_call:

permissions:
    contents: read

jobs:
    lint-rust:
        name: Automated Linting (Rust)
        runs-on: ubuntu-26.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7

            - uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: stable
                  components: rustfmt, clippy

            - name: Render userspace platform
              run: cargo run --package nekor-build -- platform --name x86_64/usermode template build

            - uses: Swatinem/rust-cache@v2

            - name: Check formatting
              run: cargo fmt --all -- --check

            - name: Run Clippy
              run: cargo clippy --workspace --all-targets -- -D warnings
