name: CI

on:
    push:
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    rust-toolchains:
        name: Resolve Rust Toolchains
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        outputs:
            matrix: ${{ steps.toolchains.outputs.matrix }}
        steps:
            - uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: stable

            - id: toolchains
              name: Resolve latest stable releases
              shell: bash
              run: |
                  stable="$(rustc +stable --version | awk '{ print $2 }')"
                  IFS=. read -r major minor patch <<< "${stable}"
                  previous_channel="${major}.$((minor - 1))"
                  rustup toolchain install "${previous_channel}" --profile minimal --no-self-update
                  previous="$(rustc +"${previous_channel}" --version | awk '{ print $2 }')"
                  echo "matrix=[\"${stable}\",\"${previous}\"]" >> "${GITHUB_OUTPUT}"

    lint-rust:
        name: Automated Linting (Rust)
        runs-on: ubuntu-26.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7

            - uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: stable
                  components: rustfmt, clippy

            - name: Render userspace platform
              run: cargo run --package nekor-build -- platform --name x86_64/usermode template build

            - uses: Swatinem/rust-cache@v2

            - name: Check formatting
              run: cargo fmt --all -- --check

            - name: Run Clippy
              run: cargo clippy --workspace --all-targets -- -D warnings

    userspace-tests:
        name: Userspace Tests (${{ matrix.toolchain }})
        needs: rust-toolchains
        runs-on: ubuntu-26.04
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                toolchain: ${{ fromJSON(needs.rust-toolchains.outputs.matrix) }}
        steps:
            - uses: actions/checkout@v7

            - uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: ${{ matrix.toolchain }}

            - uses: Swatinem/rust-cache@v2
              with:
                  key: ${{ matrix.toolchain }}

            - name: Render userspace platform
              run: cargo run --package nekor-build -- platform --name x86_64/usermode template build

            - name: Run userspace tests
              run: cargo test --workspace
              env:
                  RUSTFLAGS: --cfg usermode

    miri:
        name: Miri
        runs-on: ubuntu-26.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7

            - uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: nightly
                  components: miri

            - uses: Swatinem/rust-cache@v2

            - name: Render userspace platform
              run: cargo run --package nekor-build -- platform --name x86_64/usermode template build

            - name: Run Miri
              run: cargo miri test --workspace
              env:
                  RUSTFLAGS: --cfg usermode
