name: CI

on:
    push:
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    rust-toolchains:
        name: Resolve Rust Toolchains
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        outputs:
            matrix: ${{ steps.toolchains.outputs.matrix }}
        steps:
            - uses: actions/checkout@v7

            - uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: stable

            - id: toolchains
              uses: ./.github/actions/rust-toolchains

    lint-rust:
        uses: ./.github/workflows/lint.yml

    userspace-tests:
        name: Userspace Tests (${{ matrix.toolchain }})
        needs: [rust-toolchains, lint-rust]
        runs-on: ubuntu-26.04
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                toolchain: ${{ fromJSON(needs.rust-toolchains.outputs.matrix) }}
        steps:
            - uses: actions/checkout@v7

            - uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: ${{ matrix.toolchain }}

            - uses: Swatinem/rust-cache@v2
              with:
                  key: ${{ matrix.toolchain }}

            - name: Render userspace platform
              run: cargo run --package nekor-build -- platform --name x86_64/usermode template build

            - name: Run userspace tests
              run: cargo test --workspace
              env:
                  RUSTFLAGS: --cfg usermode

    miri:
        name: Miri
        runs-on: ubuntu-26.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7

            - uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: nightly
                  components: miri

            - uses: Swatinem/rust-cache@v2

            - name: Render userspace platform
              run: cargo run --package nekor-build -- platform --name x86_64/usermode template build

            - name: Run Miri
              run: cargo miri test --workspace
              env:
                  RUSTFLAGS: --cfg usermode
