name: CI

on:
    push:
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    rust-toolchains:
        name: Resolve Rust Toolchains
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        outputs:
            matrix: ${{ steps.toolchains.outputs.matrix }}
        steps:
            - uses: actions/checkout@v7

            - uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: stable

            - id: toolchains
              name: Resolve supported Rust releases
              shell: bash
              run: |
                  python3 - <<'PY'
                  import json
                  import os
                  import subprocess
                  import tomllib
                  from pathlib import Path

                  manifest = tomllib.loads(Path("Cargo.toml").read_text())
                  msrv = manifest["workspace"]["package"]["rust-version"]
                  stable = subprocess.check_output(["rustc", "+stable", "--version"], text=True).split()[1]
                  stable_major, stable_minor, *_ = map(int, stable.split("."))
                  msrv_major, msrv_minor, *_ = map(int, msrv.split("."))

                  if stable_major != msrv_major or stable_minor < msrv_minor:
                      raise SystemExit(f"MSRV {msrv} exceeds the latest stable Rust {stable}")

                  oldest_minor = max(msrv_minor, stable_minor - 9)
                  toolchains = [f"{stable_major}.{minor}" for minor in range(stable_minor, oldest_minor - 1, -1)]
                  if oldest_minor == msrv_minor:
                      toolchains[-1] = msrv
                  toolchains.extend(("beta", "nightly"))

                  with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                      print(f"matrix={json.dumps(toolchains)}", file=output)
                  PY

    lint-rust:
        name: Automated Linting (Rust)
        runs-on: ubuntu-26.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7

            - uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: stable
                  components: rustfmt, clippy

            - name: Render userspace platform
              run: cargo run --package nekor-build -- platform --name x86_64/usermode template build

            - uses: Swatinem/rust-cache@v2

            - name: Check formatting
              run: cargo fmt --all -- --check

            - name: Run Clippy
              run: cargo clippy --workspace --all-targets -- -D warnings

    userspace-tests:
        name: Userspace Tests (${{ matrix.toolchain }})
        needs: rust-toolchains
        runs-on: ubuntu-26.04
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                toolchain: ${{ fromJSON(needs.rust-toolchains.outputs.matrix) }}
        steps:
            - uses: actions/checkout@v7

            - uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: ${{ matrix.toolchain }}

            - uses: Swatinem/rust-cache@v2
              with:
                  key: ${{ matrix.toolchain }}

            - name: Render userspace platform
              run: cargo run --package nekor-build -- platform --name x86_64/usermode template build

            - name: Run userspace tests
              run: cargo test --workspace
              env:
                  RUSTFLAGS: --cfg usermode

    miri:
        name: Miri
        runs-on: ubuntu-26.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7

            - uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: nightly
                  components: miri

            - uses: Swatinem/rust-cache@v2

            - name: Render userspace platform
              run: cargo run --package nekor-build -- platform --name x86_64/usermode template build

            - name: Run Miri
              run: cargo miri test --workspace
              env:
                  RUSTFLAGS: --cfg usermode
