name: Tooling Lint

on:
    workflow_call:

permissions:
    contents: read

jobs:
    lint-tool:
        name: Ruff Lint
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v7

            - name: Run Ruff
              uses: astral-sh/ruff-action@v4.1.0
              with:
                  version: "0.17.4"
                  args: check tool

    format-tool:
        name: Python Formatting
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v7

            - name: Check formatting
              uses: astral-sh/ruff-action@v4.1.0
              with:
                  version: "0.17.4"
                  args: format --check tool
