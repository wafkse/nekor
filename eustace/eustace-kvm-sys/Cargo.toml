[package]
name = "eustace-kvm-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

build = "build/build.rs"

[features]
default = ["stable"]
lts = ["dep:cc", "dep:walkdir", "dep:nekor-bitwise"]
stable = ["dep:cc", "dep:walkdir", "dep:nekor-bitwise"]
internal-generate-binding = ["dep:bindgen", "dep:syn", "dep:prettyplease"]

[dependencies]
nekor-bitwise = { workspace = true, optional = true }

[lints]
workspace = true

[build-dependencies]
cc = { workspace = true, optional = true }
walkdir = { workspace = true, optional = true }
syn = { workspace = true, features = ["full", "visit-mut"], optional = true }
bindgen = { workspace = true, optional = true }
prettyplease = { version = "0.3", optional = true }
